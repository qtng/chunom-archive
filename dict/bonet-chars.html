<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonet 1899 – the characters | Chunom.org</title>
  <meta name="description" content="All Chinese characters and Chữ Nôm printed in the Annamite-French dictionary of Jean Bonet (1899), in the order of the book, each with a link to its page of the scan.">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://qatt.org/css/site.css">
  <link rel="stylesheet" href="https://qatt.org/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <script src="https://qatt.org/js/navigation.js"></script>
  <script defer src="/chunom/js/detail.js"></script>
  <style>
    :root { --ink: #2b2118; --accent: #a8362a; --paper: #f7efdc; --line: #e4d9c0; --field: #cdbf9f; --muted: #7b6c58; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    /* the header of the pages of qatt.org and the Chunom site (.hero): the look of the theme "classic"; other themes override it */
    .hero {
      background:
        radial-gradient(60rem 22rem at 50% -6rem, rgba(168, 54, 42, .10), transparent 70%),
        linear-gradient(180deg, var(--paper) 0%, #fffdf8 100%);
      border-bottom: 1px solid #e8dcc0;
      color: var(--ink);
    }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: .01em; }
    .hero .han { color: var(--accent); font-size: 1.25rem; letter-spacing: .5em; padding-left: .5em; }
    .hero .lead { max-width: 38rem; color: #4a3d30; }
    @media (max-width: 575.98px) { .hero .han { letter-spacing: .3em; } }
    main { max-width: 60rem; margin: 0 auto; padding: 0 1rem 2rem; }
    .card-box { margin: 0 0 1rem; padding: .8rem 1rem 1rem; background: #fffdf8; border: 1px solid var(--line); border-radius: .7rem; box-shadow: 0 .35rem 1rem rgba(60, 40, 20, .14); }
    /* the letters as a row of jump links, sticky below the menu bar */
    .letters { position: sticky; top: var(--nav-h, 60px); z-index: 10; display: flex; flex-wrap: wrap; gap: .25rem; justify-content: center; padding: .5rem 0; margin-bottom: .8rem;
      background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); }
    .letters a { min-width: 2rem; text-align: center; padding: .1rem .35rem; border-radius: .4rem; text-decoration: none; color: inherit; border: 1px solid var(--line); }
    .letters a:hover { border-color: var(--accent); color: var(--accent); }
    .group h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 1.5rem; margin: 0 0 .4rem; scroll-margin-top: calc(var(--nav-h, 60px) + 3.5rem); }
    .group h2 small { font-family: system-ui, sans-serif; font-size: .85rem; color: var(--muted); margin-left: .5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.6rem, 1fr)); gap: .15rem; }
    .grid button { font-family: var(--font-cjk), serif; font-size: 1.7rem; line-height: 1; aspect-ratio: 1; border: 0; border-radius: .35rem; background: none; color: inherit; padding: 0; cursor: pointer; }
    .grid button:hover, .grid button:focus-visible { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  </style>
</head>
<body>
<header class="hero pt-4 pt-sm-5 pb-4 mb-3">
  <div class="container text-center">
    <div class="han mb-2">字典</div>
    <h1 class="mb-3"><span>Bonet 1899</span> · <span data-vi="Các chữ">The characters</span></h1>
    <p class="lead mx-auto mb-3" data-vi="Mọi chữ in trong từ điển, theo thứ tự của sách. Bấm vào một chữ để xem chi tiết và các trang có chữ ấy.">Every character printed in the dictionary, in the order of the book. Click a character for its details and the pages it is on.</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="btn btn-cinnabar btn-pill" href="/chunom/dict/bonet.html"><i class="bi bi-book me-1"></i><span data-vi="Mở từ điển">Open the dictionary</span></a>
      <a class="btn btn-quiet btn-pill" href="/chunom/dict/"><i class="bi bi-journal-bookmark me-1"></i><span data-vi="Từ điển">Dictionaries</span></a>
    </div>
  </div>
</header>
<main>
  <nav class="letters" id="letters" aria-label="Letters"></nav>
  <div id="groups"><p class="text-center text-secondary" data-vi="Đang tải…">Loading…</p></div>
  <p class="small text-secondary text-center mt-3" data-vi="Chỉ mục đang được làm: một số chữ chưa có.">The index is a work in progress: some characters are still missing.</p>
</main>
<script type="module">
  // the index { char: [[page, x0, y0, x1, y1], …] } and the last headword of every page (displayed page 1 = item 0), both public
  const [index, heads] = await Promise.all(['bonet-chars', 'bonet'].map(name =>
    fetch(`/chunom/dict/data/${name}.json`).then(r => r.ok ? r.json() : null).catch(() => null)));
  const groupsBox = document.getElementById('groups');
  if (!index || !heads) {
    groupsBox.replaceChildren(Object.assign(document.createElement('p'), { className: 'text-center text-danger', textContent: Lang.t('The index could not be loaded.', 'Không tải được chỉ mục.') }));
    throw new Error('bonet index');
  }

  // the letter of a page: the first letter of its last headword without marks (đ is a letter of its own);
  // a page where a new letter begins counts to the new one (good enough for jumping)
  const letterOf = page => {
    const word = heads[page - 1] || '';
    const first = word.normalize('NFD')[0] || '?';
    return word[0] === 'đ' ? 'Đ' : first.toUpperCase();
  };

  // every character once, at its first place in the book: page, column (two per page), line
  const first = Object.entries(index).map(([ch, places]) => {
    const [page, x0, y0] = places.reduce((a, b) => (a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) <= 0 ? a : b);
    return { ch, page, key: page * 1e7 + (x0 >= 500 ? 5e6 : 0) + y0, pages: [...new Set(places.map(p => p[0]))] };
  }).sort((a, b) => a.key - b.key);

  const groups = new Map();
  for (const item of first) {
    const letter = letterOf(item.page);
    if (!groups.has(letter)) groups.set(letter, []);
    groups.get(letter).push(item);
  }

  const el = (tag, props = {}, ...children) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };
  const pageWord = () => Lang.t('p.', 'tr.');
  document.getElementById('letters').replaceChildren(...[...groups.keys()].map(letter =>
    el('a', { href: `#l-${letter}`, textContent: letter })));
  groupsBox.replaceChildren(...[...groups].map(([letter, items]) => el('section', { className: 'card-box group' },
    el('h2', { id: `l-${letter}` }, letter, el('small', { textContent: items.length.toLocaleString() })),
    el('div', { className: 'grid' }, ...items.map(item => {
      const button = el('button', { type: 'button', textContent: item.ch, title: `${pageWord()} ${item.pages.join(', ')}` });
      button.dataset.ch = item.ch;
      return button;
    })))));

  // the popup of the character (js/detail.js): its readings and its pages in Bonet with the glyph framed
  groupsBox.addEventListener('click', e => {
    const button = e.target.closest('button[data-ch]');
    if (button) window.ChunomDetail?.open(button.dataset.ch);
  });
</script>
</body>
</html>
